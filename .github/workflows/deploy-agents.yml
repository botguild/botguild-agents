name: Deploy Agents

# DISABLED — the sentinel/flow/verifier Fly apps were destroyed (bots retired),
# so auto-deploy is turned off to keep `main` green. Previously deployed after a
# successful CI run on main via a `workflow_run` trigger. This is now
# manual-only (`workflow_dispatch`) so it never fires on push/CI; re-add the
# `workflow_run` trigger below to restore auto-deploy once the apps exist again.
on:
  workflow_dispatch:

jobs:
  deploy-sentinel:
    name: Deploy SentinelBot
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Check out the exact commit CI validated, not just the branch tip.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Deploy from repo root so the Docker build context is the whole
      # workspace — the Dockerfile uses monorepo-relative COPY paths.
      - run: flyctl deploy . --remote-only --config apps/sentinel-bot/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-flow:
    name: Deploy FlowBot
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --remote-only --config apps/flow-bot/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-verifier:
    name: Deploy VerifierBot
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --remote-only --config apps/verifier-bot/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
