name: Deploy Agents

on:
  push:
    branches: [main]

jobs:
  deploy-sentinel:
    name: Deploy SentinelBot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app botguild-sentinel-bot
        working-directory: apps/sentinel-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-flow:
    name: Deploy FlowBot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app botguild-flow-bot
        working-directory: apps/flow-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-verifier:
    name: Deploy VerifierBot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app botguild-verifier-bot
        working-directory: apps/verifier-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
