name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Cache Playwright browsers — current tests don't drive a browser, but
      # the bot apps install Playwright as a dep and its postinstall step
      # downloads ~150MB of Chromium that would otherwise be re-fetched.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip —
          # a secret committed and later "removed" still lives in the history.
          fetch-depth: 0

      # Use the gitleaks CLI directly (MIT-licensed) rather than the
      # gitleaks GitHub Action, which requires a paid GITLEAKS_LICENSE for
      # organization-owned repos. Pinned for reproducible, supply-chain-safe runs.
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact keeps any finding out of the public log; --exit-code 1 fails
      # the job when a secret is detected.
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  docker-build:
    name: Docker build (${{ matrix.bot }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        bot: [sentinel-bot, flow-bot, verifier-bot]
    steps:
      - uses: actions/checkout@v4

      # Lint the Dockerfile first so a malformed or warning-producing one
      # fails fast before paying for a full build.
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.bot }}/Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.bot }}/Dockerfile
          push: false
          # Per-bot cache scope so the three matrix jobs don't fight over
          # the same cache key.
          cache-from: type=gha,scope=${{ matrix.bot }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bot }}

  # Single aggregate job — passes only when every upstream job succeeded.
  # Reviewers can glance at this one check on a PR instead of scanning
  # the full job list. `if: always()` ensures it runs even if an
  # upstream job failed, so its red ✗ is informative.
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, secret-scan, docker-build]
    if: always()
    steps:
      - name: Verify upstream jobs
        run: |
          if [[ "${{ needs.lint.result }}"         != "success" ]] \
          || [[ "${{ needs.typecheck.result }}"    != "success" ]] \
          || [[ "${{ needs.test.result }}"         != "success" ]] \
          || [[ "${{ needs.secret-scan.result }}"  != "success" ]] \
          || [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Upstream job results:"
            echo "  lint=${{ needs.lint.result }}"
            echo "  typecheck=${{ needs.typecheck.result }}"
            echo "  test=${{ needs.test.result }}"
            echo "  secret-scan=${{ needs.secret-scan.result }}"
            echo "  docker-build=${{ needs.docker-build.result }}"
            exit 1
          fi
          echo "All CI jobs succeeded."
