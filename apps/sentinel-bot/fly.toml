app = 'botguild-sentinel-bot'
primary_region = 'iad'

[build]
  # Dockerfile uses repo-root-relative COPY paths (monorepo). Deploy from
  # repo root with the workspace as build context:
  #   flyctl deploy . --remote-only --config apps/sentinel-bot/fly.toml
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  NODE_ENV = 'production'

[[mounts]]
  source = 'sentinel_data'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'
    [http_service.checks.headers]
      Accept = 'application/json'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
