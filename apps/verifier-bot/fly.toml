app = 'botguild-verifier-bot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3003'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'
    [http_service.checks.headers]
      Accept = 'application/json'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
