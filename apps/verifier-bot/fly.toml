app = 'botguild-verifier-bot'
primary_region = 'iad'

[build]
  # Dockerfile uses repo-root-relative COPY paths (monorepo). Deploy from
  # repo root with the workspace as build context:
  #   flyctl deploy . --remote-only --config apps/verifier-bot/fly.toml
  dockerfile = 'Dockerfile'

[env]
  PORT = '3003'
  NODE_ENV = 'production'

# Persistent state lives in /app/data (jobs.json + webhook-secret.json).
# Without this volume the data dir is ephemeral: the platform-issued webhook
# secret would be re-captured (and the webhook re-registered) on every
# restart, and in-progress check jobs would be lost. A mounted volume also
# structurally enforces the singleton constraint — Fly can't start a second
# machine because two machines can't share one volume, and these bots hold
# flat-file state that must not be split.
#
# The volume must be created once before the first deploy with this mount:
#   flyctl volumes create verifier_data -a botguild-verifier-bot -r iad -s 1 -y
[[mounts]]
  source = 'verifier_data'
  destination = '/app/data'

[http_service]
  internal_port = 3003
  force_https = true
  # Always-on bot: never auto-stop. With 'stop', Fly's rolling deploy can
  # leave machines in stopped state and min_machines_running doesn't reliably
  # bring them back, forcing a manual `flyctl machine start` after each
  # release. The bot listens for webhooks and polls gigs continuously — there
  # is no idle period worth scaling to zero for.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'
    [http_service.checks.headers]
      Accept = 'application/json'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
